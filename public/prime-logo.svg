<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40">
  <!-- Black pill background -->
  <rect width="120" height="40" rx="10" fill="#050505"/>
  <!-- Gold P icon box -->
  <rect x="6" y="6" width="28" height="28" rx="6" fill="#F5C518"/>
  <text x="20" y="22.5" dominant-baseline="middle" text-anchor="middle"
        font-family="Georgia,serif" font-weight="700" font-size="19"
        fill="#050505">P</text>
  <!-- PRIME wordmark -->
  <text x="52" y="21" dominant-baseline="middle" text-anchor="middle"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="15"
        fill="#F5C518" letter-spacing="2.5">PRIME</text>
</svg>
